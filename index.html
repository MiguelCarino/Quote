<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/webp" href="logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote — Quotation Maker</title>

    <script src="vendor/xlsx.full.min.js"></script>
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="vendor/jspdf.plugin.autotable.min.js"></script>
    <script src="vendor/html2canvas.min.js"></script>
<link rel="stylesheet" href="fonts/carino-fonts.css">

    <style>
        :root {
            --accent: #eab308;            /* Sharp Gold */
            --primary: #eab308;           /* alias (JSON theme may override) */
            --primary-hover: #fbbf24;
            --bg-body: #050505;
            --bg-surface: #0b0b0b;
            --bg-elev: #0d0d0d;
            --text-main: #fff;
            --text-muted: #a3a3a3;
            --border: #262626;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --sans: 'IBM Plex Sans', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
            --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --display: 'Red Hat Display', var(--sans);
        }

        * { box-sizing: border-box; }
        body { font-family: var(--sans); margin: 0; background: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 380px; background: var(--bg-surface); border-right: 1px solid var(--border);
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 22px;
        }

        .dropzone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 20px;
            text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg-elev);
        }
        .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: rgba(234,179,8,0.05); }
        .dropzone.success { border-color: var(--success); background: rgba(34,197,94,0.06); }
        .dropzone p { margin: 6px 0 0; font-family: var(--mono); font-size: 0.7rem; color: var(--text-muted); pointer-events: none; }
        .dropzone strong { color: var(--accent); pointer-events: none; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.03em; }
        .dropzone.success strong { color: var(--success); }

        .section-title { font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

        .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .form-group { flex: 1; display: flex; flex-direction: column; min-width: 100px; }

        label { font-family: var(--mono); font-size: 0.64rem; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
        input, select {
            padding: 9px 10px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.85rem; font-family: var(--mono); color: var(--text-main); transition: border-color 0.15s; width: 100%; box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(234,179,8,0.12); }
        select option { background: var(--bg-elev); color: #fff; }
        input[type=checkbox] { width: auto; accent-color: var(--accent); vertical-align: middle; }

        .edit-indicator {
            display: none; background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.5); color: var(--accent);
            padding: 8px 10px; border-radius: 6px; font-family: var(--mono); font-size: 0.72rem; margin-bottom: 12px;
            align-items: center; justify-content: space-between;
        }

        .btn { padding: 10px; border: none; border-radius: 6px; font-family: var(--mono); font-weight: 700; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.15s; text-align: center; }
        .btn-primary { background: var(--accent); color: #050505; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 14px rgba(234,179,8,0.22); }
        .btn-warning { background: var(--warning); color: #050505; width: 100%; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); width: 100%; }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-export { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.66rem; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-export:hover { border-color: var(--accent); color: var(--accent); background: rgba(234,179,8,0.05); }

        .preview-area { flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; background: var(--bg-body); }

        /* The printable quotation keeps its own LIGHT palette (scoped vars) so it
           prints/exports as a clean white document regardless of the dark chrome. */
        .paper {
            background: #ffffff; width: 100%; max-width: 900px; min-height: 800px; padding: 44px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 6px; color: #1f2937; font-family: var(--sans);
            --border: #e5e7eb; --text-muted: #6b7280; --primary: #b45309; --text-main: #1f2937;
        }
        .paper h1 { font-family: var(--display); font-weight: 900; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px 8px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-family: var(--mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 12px 8px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 0.88rem; }
        tbody tr:hover { background-color: #faf7ef; cursor: pointer; }
        .numeric { text-align: right; font-family: var(--mono); }
        .center { text-align: center; }
        .provider-link { color: var(--primary); text-decoration: none; font-size: 0.8rem; word-break: break-all; }
        .note { display: block; font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; font-style: italic; }

        .snapshot-mode .delete-col { display: none; }
        .print-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; border-bottom: 2px solid var(--primary); padding-bottom: 18px; }
        .print-logo { height: 56px; width: auto; }

        .rates-warn { background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.5); color: var(--accent); font-family: var(--mono); font-size: 0.68rem; line-height: 1.5; padding: 8px 10px; border-radius: 6px; }
        .paper .print-meta { font-family: var(--mono); font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; line-height: 1.6; }
        .paper .print-billto { font-size: 0.9rem; color: #1f2937; margin: 0 0 6px; }
        .paper .print-billto b { font-family: var(--mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); display: block; margin-bottom: 2px; }
        .paper tfoot td { border-bottom: none; padding: 6px 8px; }
        .paper tfoot .grand td { border-top: 2px solid var(--primary); font-size: 1.05rem; padding-top: 10px; }

        /* --- Catalog browser modal --- */
        .cat-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(2px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 40px; }
        .cat-modal-backdrop.open { display: flex; }
        .cat-modal { position: relative; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 980px; height: 82vh; max-height: 760px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,0.65); }
        .cat-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .cat-head h2 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 0.95rem; margin: 0; letter-spacing: 0.05em; color: var(--accent); white-space: nowrap; }
        .cat-search { flex: 1; }
        .cat-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 4px; }
        .cat-close:hover { color: var(--accent); }
        .cat-body { display: flex; flex: 1; min-height: 0; }
        .cat-rail { width: 210px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
        .cat-rail button { text-align: left; background: none; border: none; color: var(--text-muted); font-family: var(--mono); font-size: 0.72rem; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .cat-rail button:hover { color: var(--text-main); background: var(--bg-elev); }
        .cat-rail button.active { background: var(--accent); color: #050505; font-weight: 700; }
        .cat-rail .count { opacity: 0.7; font-size: 0.66rem; }
        .cat-grid { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; align-content: start; }
        .prod-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 12px 10px; background: var(--bg-elev); cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: border-color 0.15s, transform 0.1s; }
        .prod-card:hover { border-color: var(--accent); transform: translateY(-1px); }
        .prod-card .pc-prov { font-family: var(--mono); font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .prod-card .pc-desc { font-weight: 600; font-size: 0.82rem; line-height: 1.3; color: var(--text-main); }
        .prod-card .pc-note { font-size: 0.7rem; color: var(--text-muted); line-height: 1.35; }
        .prod-card .pc-foot { margin-top: auto; padding-top: 4px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .prod-card .pc-price { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 0.82rem; }
        .pc-vat { font-family: var(--mono); font-size: 0.54rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
        .pc-add { margin-top: 6px; background: transparent; color: var(--accent); border: 1px solid var(--border); border-radius: 5px; font-family: var(--mono); font-weight: 700; font-size: 0.62rem; padding: 5px 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; transition: 0.15s; }
        .pc-add:hover { background: var(--accent); color: #050505; border-color: var(--accent); }
        .cat-empty { color: var(--text-muted); font-family: var(--mono); font-size: 0.8rem; padding: 48px; text-align: center; grid-column: 1 / -1; }
        .cat-toast { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--success); color: #052e13; font-family: var(--mono); font-weight: 700; font-size: 0.72rem; padding: 8px 16px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 640px) {
            .cat-modal-backdrop { padding: 12px; }
            .cat-modal { height: 90vh; }
            .cat-rail { width: 130px; }
        }

        /* --- Mobile drawer + handy-bar helpers (hidden until the breakpoint) --- */
        #gqScrim { display: none; }
        .handy-bar { display: none; }

        @media (max-width: 900px) {
            /* Sidebar → off-canvas drawer under the 60px navbar. */
            .sidebar {
                position: fixed; top: 60px; left: 0; bottom: 0;
                width: min(90vw, 380px); z-index: 2147482000;
                transform: translateX(-100%); transition: transform 0.25s ease;
                box-shadow: 0 0 44px rgba(0, 0, 0, 0.6);
            }
            .sidebar.open { transform: translateX(0); }

            #gqScrim {
                display: block; position: fixed; inset: 60px 0 0 0;
                background: rgba(0, 0, 0, 0.55); opacity: 0; pointer-events: none;
                transition: opacity 0.25s ease; z-index: 2147481000;
            }
            #gqScrim.open { opacity: 1; pointer-events: auto; }

            .preview-area { padding: 20px; }
            .form-row { flex-direction: column; }

            /* --- Handy bar: a floating quick-action pill, mobile only ---
               Holds the actions you reach for without opening the form drawer:
               open form (☰), browse catalog, add item, then the four exports.
               It hides while the drawer is open so it never overlaps the form. */
            .handy-bar {
                display: flex; align-items: center; gap: 5px;
                position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
                z-index: 50; padding: 6px;
                background: rgba(13, 13, 13, 0.92); border: 1px solid var(--border);
                border-radius: 12px; box-shadow: 0 14px 38px rgba(0, 0, 0, 0.6);
                -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
                max-width: calc(100vw - 24px);
            }
            .handy-bar .handy-btn {
                width: 38px; height: 38px; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center;
                background: transparent; border: 1px solid transparent; border-radius: 8px;
                color: var(--text-main); font-size: 1.05rem; line-height: 1; cursor: pointer; transition: 0.15s;
            }
            .handy-bar .handy-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(234,179,8,0.08); }
            .handy-bar .handy-div { width: 1px; height: 22px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
            body.gq-lock .handy-bar { display: none; } /* out of the way while the drawer is open */
        }
    </style>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">

            <div>
                <div class="section-title" data-i18n>Global Settings</div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n>Target Currency</label>
                        <select id="global-currency" class="dynamic-currency"></select>
                    </div>
                    <div class="form-group">
                        <label data-i18n>VAT (%)</label>
                        <input type="number" id="global-vat" value="16">
                    </div>
                </div>
            </div>

            <div id="rates-warn" class="rates-warn" style="display:none;"></div>

            <div>
                <div class="section-title" data-i18n>Quotation</div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label data-i18n>Bill To (Client)</label>
                    <input type="text" id="q-client" translate="no">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n>Quote #</label>
                        <input type="text" id="q-number">
                    </div>
                    <div class="form-group">
                        <label data-i18n>Valid Until</label>
                        <input type="date" id="q-valid">
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title" data-i18n>Item Details</div>

                <div id="edit-indicator" class="edit-indicator">
                    <span data-i18n>Editing Item</span>
                    <button onclick="cancelEdit()" style="background:none;border:none;cursor:pointer;">✖</button>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label data-i18n>Catalog</label>
                    <button type="button" class="btn btn-primary" onclick="openCatalog()" style="display:flex;align-items:center;justify-content:center;gap:6px;">&#8862; <span data-i18n>Browse Catalog</span></button>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label data-i18n>Description</label>
                    <input type="text" id="description">
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 0 0 70px;">
                        <label data-i18n>Qty</label>
                        <input type="number" id="quantity" value="1" min="1">
                    </div>
                    <div class="form-group" style="flex: 1.5;">
                        <label data-i18n>Price</label>
                        <input type="number" id="price" step="0.01">
                    </div>
                    <div class="form-group">
                        <label data-i18n>Currency</label>
                        <select id="item-currency" class="dynamic-currency"></select>
                    </div>
                </div>

                <div style="align-items: center; gap: 8px; margin-bottom: 15px;">
                    <input type="checkbox" id="remove-vat">
                    <label for="remove-vat" data-i18n>Price includes VAT (Strip it)</label>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n>Provider</label>
                        <input type="text" id="provider">
                    </div>
                    <div class="form-group">
                        <label data-i18n>Link</label>
                        <input type="text" id="link">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label data-i18n>Notes</label>
                    <input type="text" id="notes">
                </div>

                <div class="form-row">
                    <button id="btn-add-update" class="btn btn-primary" onclick="handleUpsert()" data-i18n>Add Item</button>
                    <button class="btn btn-secondary" onclick="clearForm()" data-i18n>Clear</button>
                </div>
            </div>

            <div>
                <div class="section-title" data-i18n>Actions & Export</div>
                <div class="export-grid">
                    <button class="btn btn-export" onclick="exportXLSX()"><span>📊</span> <span data-i18n>Excel</span></button>
                    <button class="btn btn-export" onclick="exportPDF()"><span>📄</span> <span data-i18n>PDF</span></button>
                    <button class="btn btn-export" onclick="exportImage()"><span>🖼️</span> <span data-i18n>Image</span></button>
                    <button class="btn btn-export" onclick="sendEmail()"><span>📧</span> <span data-i18n>Email</span></button>
                </div>
            </div>

            <div class="dropzone" id="config-dropzone">
                <input type="file" id="config-input" accept=".json" hidden>
                <strong id="dz-title" data-i18n>Load Config</strong>
                <p id="dz-sub" data-i18n>Drop JSON here or click</p>
            </div>
            <div><button class="btn btn-secondary" onclick="resetAll()" style="margin-top: 10px; color: var(--danger); border-color: var(--danger);" data-i18n>Reset All</button></div>
        </aside>

        <main class="preview-area">
            <div id="paper" class="paper" translate="no">
                <div class="print-header">
                    <div>
                        <h1 id="print-org-name" style="margin:0; color:var(--primary); font-size: 1.9rem;">General Quotation</h1>
                        <p id="print-date" style="margin:5px 0 0 0; color: var(--text-muted); font-size: 0.9rem;"></p>
                    </div>
                    <div style="text-align:right;">
                        <img id="print-logo" class="print-logo" style="display:none;" alt="Logo">
                        <div id="print-meta" class="print-meta"></div>
                    </div>
                </div>
                <div id="print-billto" class="print-billto"></div>

                <table id="quoteTable">
                    <thead>
                        <tr>
                            <th style="width: 50px;" class="center" data-i18n>Qty</th>
                            <th data-i18n>Description</th>
                            <th data-i18n>Details</th>
                            <th class="numeric" data-i18n>Unit (net)</th>
                            <th class="numeric" data-i18n>Amount (net)</th>
                            <th class="delete-col"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                    <tfoot></tfoot>
                </table>
            </div>
        </main>
    </div>

    <!-- Catalog browser: category rail + searchable product cards. Business
         data, so translate="no" keeps browser auto-translate from mangling it. -->
    <div id="cat-modal" class="cat-modal-backdrop" translate="no" onclick="if(event.target===this) closeCatalog()">
        <div class="cat-modal" role="dialog" aria-modal="true">
            <div class="cat-head">
                <h2 data-i18n>Browse Catalog</h2>
                <input type="text" id="cat-search" class="cat-search" oninput="catState.q=this.value; renderCatalog();" autocomplete="off">
                <button class="cat-close" onclick="closeCatalog()" aria-label="Close">&times;</button>
            </div>
            <div class="cat-body">
                <nav id="cat-rail" class="cat-rail"></nav>
                <div id="cat-grid" class="cat-grid"></div>
            </div>
            <div id="cat-toast" class="cat-toast"></div>
        </div>
    </div>

<script>

        const DEFAULT_CURRENCIES = ["USD", "MXN", "CAD", "JPY"];

        // --- 2. STATE ---
        let appState = {
            config: {
                orgName: "General Quotation",
                logo: "logo.webp",
                url: "https://carino.systems",
                targetCurrency: "USD",
                vatRate: 16
            },
            theme: { primary: "#eab308", background: "#050505" },
            availableCurrencies: DEFAULT_CURRENCIES,
            customDictionary: {},
            catalog: [],
            items: [],
            rates: {},
            ratesOk: true,
            ratesDate: null,
            editingId: null,
            meta: { client: "", quoteNo: "", validUntil: "" }
        };

        // --- 3. INIT FLOW ---
        document.addEventListener('DOMContentLoaded', async () => {
            // A. Apply Default Config First
            applyConfig(DEFAULT_CONFIG);

            // B. Overwrite with LocalStorage if exists (Persistence)
            loadState();

            // C. Setup System (language itself is owned by carino-lang.js + i18n.js;
            // here we only fold any config-supplied dictionary into I18N)
            mergeCustomDictionary();
            setupUI();
            updatePlaceholders();
            await fetchRates();
            renderTable();

            // Close the catalog browser on Escape.
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCatalog(); });
        });

        // --- 4. CORE FUNCTIONS ---

        // NEW: Reusable function to apply JSON to AppState
        function applyConfig(json) {
            if(json.organization) {
                appState.config.orgName = json.organization.name || appState.config.orgName;
                appState.config.logo = json.organization.logo || null;
                appState.config.url = json.organization.url || "https://carino.systems";
            }
            if(json.theme) appState.theme = json.theme;

            if(json.settings) {
                if(json.settings.currencies) appState.availableCurrencies = json.settings.currencies;
                if(json.settings.defaults) {
                    if(json.settings.defaults.currency) appState.config.targetCurrency = json.settings.defaults.currency;
                    // Language is a fleet-wide preference (carino-lang.js), not per-config.
                }
            }

            if(json.dictionary) {
                appState.customDictionary = json.dictionary;
            }

            if(json.catalog) appState.catalog = json.catalog;
        }

        function loadState() {
            const saved = localStorage.getItem('quoteConfig');
            if (saved) {
                const parsed = JSON.parse(saved);
                // We merge saved state on top of the default config
                appState.config = { ...appState.config, ...parsed.config };
                if(parsed.items && parsed.items.length > 0) appState.items = parsed.items; // Only restore items if they exist
                if(parsed.theme) appState.theme = parsed.theme;
                if(parsed.availableCurrencies) appState.availableCurrencies = parsed.availableCurrencies;
                if(parsed.customDictionary) appState.customDictionary = parsed.customDictionary;
                if(parsed.catalog && parsed.catalog.length > 0) appState.catalog = parsed.catalog;
                if(parsed.meta) appState.meta = { ...appState.meta, ...parsed.meta };
            }
        }

        function saveState() {
            // Persist a lean subset (skip transient rates / logo data-URI / editing flag).
            const { rates, ratesOk, ratesDate, editingId, config, ...rest } = appState;
            const { logoData, logoAspect, ...cfg } = config;
            localStorage.setItem('quoteConfig', JSON.stringify({ ...rest, config: cfg }));
        }

        function setupUI() {
            // Colors
            document.documentElement.style.setProperty('--primary', appState.theme.primary);
            document.documentElement.style.setProperty('--bg-body', appState.theme.background);

            // Branding: the top bar is the shared Carino navbar; only the
            // printable document carries the org name + logo.
            if (appState.config.logo) {
                const pl = document.getElementById('print-logo');
                pl.src = appState.config.logo;
                pl.style.display = 'block';
            }
            // t() falls back to the string itself, so custom org names pass through
            // untouched while the default "General Quotation" heading localizes.
            document.getElementById('print-org-name').innerText = t(appState.config.orgName);
            document.title = `${appState.config.orgName} - Quote`;

            // Dropzone Logic
            setupDropzone();

            // Currencies
            const currencySelects = document.querySelectorAll('.dynamic-currency');
            currencySelects.forEach(select => {
                const currentVal = select.value || appState.config.targetCurrency;
                select.innerHTML = '';
                appState.availableCurrencies.forEach(curr => {
                    const opt = document.createElement('option');
                    opt.value = curr;
                    opt.innerText = curr;
                    select.appendChild(opt);
                });
                select.value = appState.availableCurrencies.includes(currentVal) ? currentVal : appState.availableCurrencies[0];
            });

            document.getElementById('global-vat').value = appState.config.vatRate;
            normalizeCatalog();

            // Listeners
            document.getElementById('global-currency').onchange = (e) => {
                appState.config.targetCurrency = e.target.value;
                fetchRates().then(renderTable);
                saveState();
            };
            document.getElementById('global-vat').oninput = (e) => {
                appState.config.vatRate = parseFloat(e.target.value) || 0;
                renderTable();
                saveState();
            };

            // Quotation meta (client / quote # / valid-until)
            if (!appState.meta) appState.meta = { client: '', quoteNo: '', validUntil: '' };
            if (!appState.meta.quoteNo) appState.meta.quoteNo = 'Q-' + new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const qc = document.getElementById('q-client');
            const qn = document.getElementById('q-number');
            const qv = document.getElementById('q-valid');
            if (qc) { qc.value = appState.meta.client || ''; qc.oninput = (e) => { appState.meta.client = e.target.value; saveState(); renderTable(); }; }
            if (qn) { qn.value = appState.meta.quoteNo || ''; qn.oninput = (e) => { appState.meta.quoteNo = e.target.value; saveState(); renderTable(); }; }
            if (qv) { qv.value = appState.meta.validUntil || ''; qv.oninput = (e) => { appState.meta.validUntil = e.target.value; saveState(); renderTable(); }; }

            loadLogoData();
        }

        function setupDropzone() {
            const dropzone = document.getElementById('config-dropzone');
            const fileInput = document.getElementById('config-input');

            // Visual state check
            if(localStorage.getItem('quoteConfig')) {
                dropzone.classList.add('success');
                setDzTitle('Config Loaded');
            }

            dropzone.onclick = () => fileInput.click();
            dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
            dropzone.ondragleave = () => dropzone.classList.remove('dragover');
            dropzone.ondrop = (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); if(e.dataTransfer.files.length) processConfigFile(e.dataTransfer.files[0]); };
            fileInput.onchange = (e) => { if(e.target.files.length) processConfigFile(e.target.files[0]); };
        }

        function processConfigFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);

                    // Use the shared apply function
                    applyConfig(json);
                    mergeCustomDictionary();

                    saveState();
                    setupUI();
                    applyStaticI18n();
                    updatePlaceholders();
                    renderTable();

                    // Success Feedback
                    const dz = document.getElementById('config-dropzone');
                    dz.classList.add('success');
                    setDzTitle('Config Loaded');

                } catch (err) {
                    alert(t('Invalid JSON file'));
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // --- CATALOG BROWSER ---
        // catalog entries are flat but carry a `category`; the browser groups by it.
        let catState = { cat: '__all', q: '' };
        let _idSeq = 0;
        function nextId() { return Date.now() * 1000 + ((_idSeq++) % 1000); }

        // Ensure every entry has a category (older/flat configs default to "General").
        function normalizeCatalog() {
            appState.catalog = (appState.catalog || []).map(it => ({
                ...it,
                category: (it.category && String(it.category).trim()) || 'General'
            }));
        }

        function openCatalog() {
            normalizeCatalog();
            catState = { cat: '__all', q: '' };
            const s = document.getElementById('cat-search');
            s.value = ''; s.placeholder = t('Search products & services…');
            renderCatalog();
            document.getElementById('cat-modal').classList.add('open');
            s.focus();
        }
        function closeCatalog() { document.getElementById('cat-modal').classList.remove('open'); }

        function setCatFilter(c) { catState.cat = c; renderCatalog(); }

        function catCategories() {
            const map = new Map();
            appState.catalog.forEach(it => map.set(it.category, (map.get(it.category) || 0) + 1));
            return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]));
        }

        function renderCatalog() {
            // Category rail (with counts). Built via DOM so category names with
            // spaces/& can't break out of an inline onclick attribute.
            const rail = document.getElementById('cat-rail');
            rail.innerHTML = '';
            const mkRailBtn = (label, count, value) => {
                const b = document.createElement('button');
                if (catState.cat === value) b.className = 'active';
                b.innerHTML = `${escapeHtml(label)} <span class="count">${count}</span>`;
                b.onclick = () => setCatFilter(value);
                rail.appendChild(b);
            };
            mkRailBtn(t('All'), appState.catalog.length, '__all');
            catCategories().forEach(([name, count]) => mkRailBtn(name, count, name));

            // Product grid (category filter + free-text search over desc/provider/note)
            const q = catState.q.trim().toLowerCase();
            const grid = document.getElementById('cat-grid');
            const matches = appState.catalog
                .map((it, i) => ({ it, i }))
                .filter(({ it }) =>
                    (catState.cat === '__all' || it.category === catState.cat) &&
                    (!q || (it.description || '').toLowerCase().includes(q)
                         || (it.provider || '').toLowerCase().includes(q)
                         || (it.note || '').toLowerCase().includes(q)));

            if (!matches.length) {
                grid.innerHTML = `<div class="cat-empty">${t('No matching items')}</div>`;
                return;
            }
            grid.innerHTML = matches.map(({ it, i }) => `
                <div class="prod-card" onclick="fillFromCatalog(${i})" title="${escapeAttr(t('Click to fill the form; use + to add directly'))}">
                    <div class="pc-prov">${escapeHtml(it.provider || '—')}</div>
                    <div class="pc-desc">${escapeHtml(it.description || '')}</div>
                    ${it.note ? `<div class="pc-note">${escapeHtml(it.note)}</div>` : ''}
                    <div class="pc-foot">
                        <span class="pc-price">${(+it.price || 0).toFixed(2)} ${escapeHtml(it.currency || 'USD')}</span>
                        ${it.vatStripped ? `<span class="pc-vat">${t('incl. VAT')}</span>` : ''}
                    </div>
                    <button class="pc-add" onclick="event.stopPropagation(); quickAddCatalog(${i})">+ ${t('Add Item')}</button>
                </div>`).join('');
        }

        // Card click: prefill the item form so qty/currency can be tweaked before adding.
        function fillFromCatalog(idx) {
            const it = appState.catalog[idx];
            if (!it) return;
            document.getElementById('description').value = it.description || '';
            document.getElementById('price').value = it.price || '';
            document.getElementById('quantity').value = 1;
            document.getElementById('item-currency').value = it.currency || appState.config.targetCurrency;
            document.getElementById('provider').value = it.provider || '';
            document.getElementById('link').value = it.link || '';
            document.getElementById('notes').value = it.note || '';
            document.getElementById('remove-vat').checked = it.vatStripped || false;
            closeCatalog();
            document.getElementById('description').focus();
        }

        // "+" button: add straight to the quote (qty 1) and keep the browser open
        // so several items can be added in one pass.
        function quickAddCatalog(idx) {
            const it = appState.catalog[idx];
            if (!it) return;
            appState.items.push({
                id: nextId(),
                desc: it.description || '', price: +it.price || 0, qty: 1,
                currency: it.currency || appState.config.targetCurrency,
                provider: it.provider || '', link: it.link || '',
                note: it.note || '', stripVat: it.vatStripped || false
            });
            saveState();
            renderTable();
            catToast('✓ ' + (it.description || t('Add Item')));
        }

        function catToast(msg) {
            const t = document.getElementById('cat-toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._to);
            t._to = setTimeout(() => t.classList.remove('show'), 1300);
        }

        function handleUpsert() {
            const desc = document.getElementById('description').value;
            const price = parseFloat(document.getElementById('price').value);
            const qty = parseFloat(document.getElementById('quantity').value) || 1;

            if (!desc || isNaN(price) || price <= 0) return alert(t('Description and a price greater than 0 are required'));

            const itemData = {
                id: appState.editingId || Date.now(),
                desc, price, qty,
                currency: document.getElementById('item-currency').value,
                provider: document.getElementById('provider').value,
                link: document.getElementById('link').value,
                note: document.getElementById('notes').value,
                stripVat: document.getElementById('remove-vat').checked
            };

            if (appState.editingId) {
                const index = appState.items.findIndex(i => i.id === appState.editingId);
                if (index !== -1) appState.items[index] = itemData;
                cancelEdit();
            } else {
                appState.items.push(itemData);
                clearForm();
            }
            saveState();
            renderTable();
        }

        function loadItemForEdit(id) {
            const item = appState.items.find(i => i.id === id);
            if(!item) return;
            appState.editingId = id;
            document.getElementById('description').value = item.desc;
            document.getElementById('price').value = item.price;
            document.getElementById('quantity').value = item.qty || 1;
            document.getElementById('item-currency').value = item.currency;
            document.getElementById('provider').value = item.provider;
            document.getElementById('link').value = item.link;
            document.getElementById('notes').value = item.note;
            document.getElementById('remove-vat').checked = item.stripVat;

            document.getElementById('edit-indicator').style.display = 'flex';
            const btn = document.getElementById('btn-add-update');
            btn.dataset.i18nKey = 'Update Item'; // keep applyStaticI18n in sync
            btn.innerText = t('Update Item');
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-warning');
        }

        function cancelEdit() {
            appState.editingId = null;
            clearForm();
            document.getElementById('edit-indicator').style.display = 'none';
            const btn = document.getElementById('btn-add-update');
            btn.dataset.i18nKey = 'Add Item'; // keep applyStaticI18n in sync
            btn.innerText = t('Add Item');
            btn.classList.remove('btn-warning');
            btn.classList.add('btn-primary');
        }

        function deleteItem(id, event) {
            event.stopPropagation();
            if(confirm(t('Remove this item?'))) {
                appState.items = appState.items.filter(i => i.id !== id);
                if(appState.editingId === id) cancelEdit();
                saveState();
                renderTable();
            }
        }

        function clearForm() {
            document.getElementById('description').value = "";
            document.getElementById('price').value = "";
            document.getElementById('quantity').value = 1;
            document.getElementById('provider').value = "";
            document.getElementById('link').value = "";
            document.getElementById('notes').value = "";
            document.getElementById('remove-vat').checked = false;
        }

        function resetAll() {
            if(confirm(t('Delete all data?'))) {
                localStorage.removeItem('quoteConfig');
                location.reload();
            }
        }

        // --- MATH & RENDER ---
        async function fetchRates() {
            const base = appState.config.targetCurrency;
            const CACHE_KEY = 'quoteRates';
            // Serve a fresh cache (< 12h, same base) without hitting the network.
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (c && c.base === base && (Date.now() - c.ts) < 12 * 3600 * 1000) {
                    appState.rates = c.rates; appState.ratesOk = true; appState.ratesDate = c.date || null;
                    renderRatesWarning(); return;
                }
            } catch (e) {}
            try {
                // Frankfurter: free, CORS-open, ECB reference rates. rates[X] = X per 1 base.
                const res = await fetch(`https://api.frankfurter.app/latest?from=${encodeURIComponent(base)}`);
                if (!res.ok) throw new Error('rate http ' + res.status);
                const data = await res.json();
                appState.rates = data.rates || {};
                appState.rates[base] = 1;
                appState.ratesOk = true;
                appState.ratesDate = data.date || null;
                localStorage.setItem(CACHE_KEY, JSON.stringify({ base, rates: appState.rates, date: data.date, ts: Date.now() }));
            } catch (e) {
                let cached = null;
                try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (_) {}
                if (cached && cached.base === base) { appState.rates = cached.rates; appState.ratesDate = cached.date; appState.ratesOk = true; }
                else { appState.rates = {}; appState.ratesOk = false; }
            }
            renderRatesWarning();
        }

        function renderRatesWarning() {
            const el = document.getElementById('rates-warn');
            if (!el) return;
            const target = appState.config.targetCurrency;
            const mixed = appState.items.some(i => i.currency !== target);
            if (!appState.ratesOk && mixed) {
                el.style.display = 'block';
                el.innerText = '\u26A0 ' + t('Live exchange rates unavailable — converted amounts may be inaccurate.');
            } else {
                el.style.display = 'none';
            }
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function escapeAttr(s) { return escapeHtml(s); }

        // Preload the logo into a PNG data URI so it shows up in PDF/image exports.
        function loadLogoData() {
            const src = appState.config.logo;
            if (!src) return;
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    appState.config.logoData = canvas.toDataURL('image/png');
                    appState.config.logoAspect = (img.naturalHeight / img.naturalWidth) || 1;
                } catch (e) { /* cross-origin without CORS \u2192 skip embedding */ }
            };
            img.src = src;
        }

        function getRate(from, to) {
            if (from === to) return 1;
            const r = appState.rates[from];
            return r ? (1/r) : 1;
        }

        function renderTable() {
            const tbody = document.querySelector('#quoteTable tbody');
            const tfoot = document.querySelector('#quoteTable tfoot');
            tbody.innerHTML = '';

            const targetCurr = appState.config.targetCurrency;
            const vatPct = appState.config.vatRate || 0;
            let subtotal = 0;

            appState.items.forEach(item => {
                const qty = item.qty || 1;
                const rate = getRate(item.currency, targetCurr);
                const netUnitSrc = item.stripVat ? item.price / (1 + (vatPct/100)) : item.price;  // normalise to ex-VAT
                const netUnit = netUnitSrc * rate;                                                 // in target currency
                const lineNet = netUnit * qty;
                subtotal += lineNet;

                const showOrig = (item.currency !== targetCurr) || item.stripVat;
                const origNote = showOrig
                    ? `<div style="font-size:0.72em;color:#9ca3af;">${item.price.toFixed(2)} ${escapeHtml(item.currency)}${item.stripVat ? ' ' + t('incl. VAT') : ''}</div>`
                    : '';

                const tr = document.createElement('tr');
                tr.onclick = () => loadItemForEdit(item.id);
                tr.innerHTML = `
                    <td class="center" style="font-weight:600;">${qty}</td>
                    <td><strong>${escapeHtml(item.desc)}</strong>${item.note ? `<span class="note">${escapeHtml(item.note)}</span>` : ''}</td>
                    <td>
                        <div>${escapeHtml(item.provider || '-')}</div>
                        ${item.link ? `<a href="${escapeAttr(item.link)}" target="_blank" rel="noopener" class="provider-link" onclick="event.stopPropagation()">Link ↗</a>` : ''}
                    </td>
                    <td class="numeric">${netUnit.toFixed(2)} ${targetCurr}${origNote}</td>
                    <td class="numeric"><strong>${lineNet.toFixed(2)} ${targetCurr}</strong></td>
                    <td class="delete-col">
                        <button onclick="deleteItem(${item.id}, event)" style="color:var(--danger); background:none; border:none; cursor:pointer; font-size:1.2em;">&times;</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const vatAmount = subtotal * (vatPct/100);
            const total = subtotal + vatAmount;
            tfoot.innerHTML = `
                <tr class="sub"><td colspan="4" style="text-align:right; color:var(--text-muted);">${t('Subtotal')}</td>
                    <td class="numeric">${subtotal.toFixed(2)} ${targetCurr}</td><td></td></tr>
                <tr><td colspan="4" style="text-align:right; color:var(--text-muted);">${t('VAT')} (${vatPct}%)</td>
                    <td class="numeric">${vatAmount.toFixed(2)} ${targetCurr}</td><td></td></tr>
                <tr class="grand" style="font-weight:bold;"><td colspan="4" style="text-align:right;">${t('TOTAL (Inc. VAT)')}</td>
                    <td class="numeric" style="color:var(--primary);">${total.toFixed(2)} ${targetCurr}</td><td></td></tr>
            `;

            document.getElementById('print-date').innerText = `${t('Date')}: ${new Date().toLocaleDateString()}`;
            const meta = appState.meta || {};
            const metaLines = [];
            if (meta.quoteNo) metaLines.push(`${t('Quote #')}: ${escapeHtml(meta.quoteNo)}`);
            if (meta.validUntil) metaLines.push(`${t('Valid Until')}: ${escapeHtml(meta.validUntil)}`);
            const pm = document.getElementById('print-meta'); if (pm) pm.innerHTML = metaLines.join('<br>');
            const bt = document.getElementById('print-billto'); if (bt) bt.innerHTML = meta.client ? `<b>${t('Bill To')}</b>${escapeHtml(meta.client)}` : '';

            renderRatesWarning();
        }

        // --- EXPORTS ---
        function exportXLSX() {
            const targetCurr = appState.config.targetCurrency;
            const vatPct = appState.config.vatRate;

            let subtotal = 0;
            const data = appState.items.map(i => {
                const qty = i.qty || 1;
                const rate = getRate(i.currency, targetCurr);
                const netUnitSrc = i.stripVat ? i.price / (1 + (vatPct/100)) : i.price;
                const netUnit = netUnitSrc * rate;
                const lineNet = netUnit * qty;
                subtotal += lineNet;
                return {
                    [t('Qty')]: qty,
                    [t('Description')]: i.desc,
                    [t('Provider')]: i.provider,
                    "URL": i.link,
                    [t('Price')]: i.price,
                    [t('Currency')]: i.currency,
                    [`${t('Unit (net)')} (${targetCurr})`]: +netUnit.toFixed(2),
                    [`${t('Amount (net)')} (${targetCurr})`]: +lineNet.toFixed(2)
                };
            });
            const vatAmount = subtotal * (vatPct/100);
            data.push({},
                { [t('Description')]: t('Subtotal'), [`${t('Amount (net)')} (${targetCurr})`]: +subtotal.toFixed(2) },
                { [t('Description')]: `${t('VAT')} (${vatPct}%)`, [`${t('Amount (net)')} (${targetCurr})`]: +vatAmount.toFixed(2) },
                { [t('Description')]: t('TOTAL (Inc. VAT)'), [`${t('Amount (net)')} (${targetCurr})`]: +(subtotal + vatAmount).toFixed(2) }
            );
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Quote");
            XLSX.writeFile(wb, `${appState.config.orgName}_Quote.xlsx`);
        }

        function exportImage() {
            const el = document.getElementById('paper');
            el.classList.add('snapshot-mode');
            html2canvas(el, { useCORS: true, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'quote.png';
                link.href = canvas.toDataURL();
                link.click();
                el.classList.remove('snapshot-mode');
            });
        }

        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let fontUsed = "helvetica";
            try {
                // Noto Sans JP — self-hosted full TTF (latin + kana + kanji) for jsPDF embedding.
                const fontRes = await fetch('fonts/NotoSansJP-Regular.ttf');
                if(fontRes.ok) {
                    const fontBuf = await fontRes.arrayBuffer();
                    doc.addFileToVFS("NotoSansJP.ttf", new Uint8Array(fontBuf));
                    doc.addFont("NotoSansJP.ttf", "NotoSansJP", "normal");
                    fontUsed = "NotoSansJP";
                }
            } catch(e) { console.warn("Font load failed, fallback to Helvetica"); }

            const targetCurr = appState.config.targetCurrency;
            const vatPct = appState.config.vatRate;

            doc.setFont(fontUsed);
            const meta = appState.meta || {};
            doc.setFontSize(16);
            doc.text(appState.config.orgName, 14, 20);
            doc.setFontSize(10);
            let hy = 28;
            doc.text(`${t('Date')}: ${new Date().toLocaleDateString()}`, 14, hy);
            if (meta.quoteNo)    { hy += 6; doc.text(`${t('Quote #')}: ${meta.quoteNo}`, 14, hy); }
            if (meta.validUntil) { hy += 6; doc.text(`${t('Valid Until')}: ${meta.validUntil}`, 14, hy); }
            if (meta.client)     { hy += 6; doc.text(`${t('Bill To')}: ${meta.client}`, 14, hy); }

            if (appState.config.logoData) {
                try { doc.addImage(appState.config.logoData, 'PNG', 168, 12, 26, 26 * (appState.config.logoAspect || 1)); } catch(e){}
            }

            let subtotal = 0;
            const body = appState.items.map(i => {
                const qty = i.qty || 1;
                const rate = getRate(i.currency, targetCurr);
                const netUnitSrc = i.stripVat ? i.price / (1 + (vatPct/100)) : i.price;
                const netUnit = netUnitSrc * rate;
                const lineNet = netUnit * qty;
                subtotal += lineNet;
                return [qty, i.desc, i.provider || '', i.link || '', `${netUnit.toFixed(2)} ${targetCurr}`, `${lineNet.toFixed(2)} ${targetCurr}`];
            });
            const vatAmount = subtotal * (vatPct/100);
            const total = subtotal + vatAmount;

            doc.autoTable({
                head: [[t('Qty'), t('Description'), t('Provider'), "Link", t('Unit (net)'), t('Amount (net)')]],
                body: body,
                foot: [
                    [{ content: t('Subtotal'), colSpan: 5, styles: { halign: 'right' } }, `${subtotal.toFixed(2)} ${targetCurr}`],
                    [{ content: `${t('VAT')} (${vatPct}%)`, colSpan: 5, styles: { halign: 'right' } }, `${vatAmount.toFixed(2)} ${targetCurr}`],
                    [{ content: t('TOTAL (Inc. VAT)'), colSpan: 5, styles: { halign: 'right', fontStyle: 'bold' } }, { content: `${total.toFixed(2)} ${targetCurr}`, styles: { fontStyle: 'bold' } }]
                ],
                startY: hy + 6,
                styles: { font: fontUsed, fontSize: 9, overflow: 'linebreak' },
                headStyles: { fillColor: [234, 179, 8], textColor: [5, 5, 5] },
                footStyles: { fillColor: [245, 245, 245], textColor: [31, 41, 55] },
                columnStyles: { 3: { textColor: [0,0,255] } },
                didDrawCell: (d) => {
                    if (d.column.index === 3 && d.cell.raw && d.section === 'body') {
                        doc.link(d.cell.x, d.cell.y, d.cell.width, d.cell.height, { url: d.cell.raw });
                    }
                }
            });
            doc.save('quote.pdf');
        }

        function sendEmail() {
            const targetCurr = appState.config.targetCurrency;
            const vatPct = appState.config.vatRate;
            const meta = appState.meta || {};
            let body = `${t('Here is the quotation summary:')}\n\n`;
            if (meta.client) body += `${t('Bill To')}: ${meta.client}\n`;
            if (meta.quoteNo) body += `${t('Quote #')}: ${meta.quoteNo}\n`;
            if (meta.validUntil) body += `${t('Valid Until')}: ${meta.validUntil}\n`;
            body += `\n`;
            let subtotal = 0;
            appState.items.forEach(i => {
                const qty = i.qty || 1;
                const rate = getRate(i.currency, targetCurr);
                const netUnitSrc = i.stripVat ? i.price / (1 + (vatPct/100)) : i.price;
                const lineNet = netUnitSrc * rate * qty;
                subtotal += lineNet;
                const qtyStr = qty > 1 ? `${qty}x ` : '';
                body += `• ${qtyStr}${i.desc} (${i.provider}): ${lineNet.toFixed(2)} ${targetCurr}\n`;
                if(i.link) body += `  ${i.link}\n`;
            });
            const vatAmount = subtotal * (vatPct/100);
            body += `\n${t('Subtotal')}: ${subtotal.toFixed(2)} ${targetCurr}`;
            body += `\n${t('VAT')} (${vatPct}%): ${vatAmount.toFixed(2)} ${targetCurr}`;
            body += `\n${t('TOTAL (Inc. VAT)')}: ${(subtotal + vatAmount).toFixed(2)} ${targetCurr}`;
            const subject = `${appState.config.orgName} - Quote`;
            window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        // --- I18N glue (dictionaries + t()/applyStaticI18n live in i18n.js) ---
        // A loaded config JSON may still ship a "dictionary": { es: { "English
        // string": "translation", ... }, ... } keyed by language code; entries
        // are keyed by the ENGLISH source string and merge on top of the
        // built-in fleet dictionaries. "en" needs no dictionary — English
        // strings ARE the keys.
        function mergeCustomDictionary() {
            if (!appState.customDictionary) return;
            Object.keys(appState.customDictionary).forEach(lang => {
                const code = (window.CarinoLang && CarinoLang.resolve(lang)) || lang;
                if (code === 'en') return;
                I18N[code] = Object.assign(I18N[code] || {}, appState.customDictionary[lang]);
            });
        }

        function updatePlaceholders() {
            document.getElementById('description').placeholder = t('Description');
            document.getElementById('notes').placeholder = t('Notes');
            document.getElementById('cat-search').placeholder = t('Search products & services…');
        }

        // Dropzone title flips between 'Load Config' and 'Config Loaded';
        // track the key so applyStaticI18n keeps the right one on lang change.
        function setDzTitle(key) {
            const el = document.getElementById('dz-title');
            el.dataset.i18nKey = key;
            el.textContent = t(key);
        }

        // i18n.js calls this after every applyStaticI18n() pass (initial load
        // and each carino:langchange) so dynamic surfaces re-render translated.
        window.onLanguageApplied = () => {
            updatePlaceholders();
            document.getElementById('print-org-name').innerText = t(appState.config.orgName);
            renderTable();
            const modal = document.getElementById('cat-modal');
            if (modal && modal.classList.contains('open')) renderCatalog();
        };
    </script>
  <!-- Handy bar: floating quick-action pill, shown on mobile only (see CSS).
       Buttons call the same handlers as the sidebar; ☰ opens the form drawer. -->
  <div class="handy-bar" id="handyBar" role="toolbar" aria-label="Quick actions">
    <button type="button" id="handyMenu" class="handy-btn" title="Open form" aria-label="Open form">☰</button>
    <button type="button" class="handy-btn" title="Browse catalog" aria-label="Browse catalog" onclick="openCatalog()">&#8862;</button>
  </div>

  <script src="carino-navbar.js" data-app="Quote" data-repo="Quote" defer></script>
  <script src="carino-lang.js" defer></script>
  <script src="i18n.js" defer></script>
  <script>
  /* Mobile: the sidebar becomes an off-canvas drawer opened from the floating
     handy bar's ☰. Everything reverses above 900px, where the handy bar is
     hidden and options live in the sidebar. (The language switcher is the
     fleet-wide one injected into the navbar by carino-lang.js.) */
  (function () {
    'use strict';
    var MQ = window.matchMedia('(max-width: 900px)');
    var sidebar = document.querySelector('.sidebar');
    if (!sidebar) return;

    var scrim = document.createElement('div');
    scrim.id = 'gqScrim';
    document.body.appendChild(scrim);

    function open() { sidebar.classList.add('open'); scrim.classList.add('open'); document.body.classList.add('gq-lock'); }
    function close() { sidebar.classList.remove('open'); scrim.classList.remove('open'); document.body.classList.remove('gq-lock'); }
    function toggle() { sidebar.classList.contains('open') ? close() : open(); }

    scrim.addEventListener('click', close);
    window.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

    var menu = document.getElementById('handyMenu');
    if (menu) menu.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });

    // Close the drawer when the layout flips back to desktop.
    function onBreak() { if (!MQ.matches) close(); }
    if (MQ.addEventListener) MQ.addEventListener('change', onBreak);
    else if (MQ.addListener) MQ.addListener(onBreak);
  })();
  </script>
